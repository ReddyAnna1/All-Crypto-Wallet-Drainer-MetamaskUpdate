<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian's club</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: #1e293b;
            --card-border: #334155;
            --special: #f97316;
            --special-hover: #ea580c;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--darker);
            color: var(--light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        /* Premium Navigation Bar */
        .compact-nav {
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            white-space: nowrap;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            scrollbar-width: none;
            border-bottom: 1px solid var(--card-border);
        }
        
        .compact-nav::-webkit-scrollbar {
            display: none;
        }
        
        .nav-item {
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            border-bottom: 2px solid transparent;
        }
        
        .nav-item:hover {
            color: var(--light);
            background: rgba(139, 92, 246, 0.1);
        }
        
        .nav-item.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            font-weight: 600;
        }
        
        .nav-divider {
            padding: 0 8px;
            color: var(--card-border);
            display: flex;
            align-items: center;
            opacity: 0.5;
        }
        
        .nav-special {
            color: white;
            background: linear-gradient(135deg, var(--special), #f59e0b);
            font-weight: 600;
            border-radius: 6px;
            margin: 8px 4px;
            padding: 8px 16px;
        }
        
        .nav-special:hover {
            background: linear-gradient(135deg, var(--special-hover), #d97706);
            color: white;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }
        
        .content {
            margin-top: 72px;
            padding: 24px;
        }
        
        /* Premium Header */
        .premium-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }
        
        .premium-header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .stats-container {
            display: flex;
            gap: 16px;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            min-width: 160px;
        }
        
        .stat-card h3 {
            color: var(--gray);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .stat-card p {
            font-size: 20px;
            font-weight: 600;
        }
        
        /* Marketplace Grid */
        .marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        
        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }
        
        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--danger);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .product-image {
            height: 160px;
            background: linear-gradient(45deg, #1e293b, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 48px;
        }
        
        .product-details {
            padding: 16px;
        }
        
        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        
        .product-price {
            color: var(--primary);
            font-weight: 700;
        }
        
        .product-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 12px;
        }
        
        .product-rating {
            color: #fbbf24;
        }
        
        .product-description {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .product-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        .btn-outline:hover {
            background: rgba(139, 92, 246, 0.1);
        }
        
        .last-updated {
            text-align: right;
            color: var(--gray);
            font-size: 12px;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .stats-container {
                flex-direction: column;
                gap: 12px;
            }
            
            .stat-card {
                min-width: auto;
            }
            
            .marketplace-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="compact-nav">
        <a href="news.html" class="nav-item active"><i class="fas fa-newspaper"></i> News</a>
        <a href="dumps.html" class="nav-item"><i class="fas fa-credit-card"></i> Dumps</a>
        <a href="cvv2.html" class="nav-item"><i class="fas fa-id-card"></i> CVV2</a>
        <a href="fullz.html" class="nav-item"><i class="fas fa-user-tag"></i> Fullz</a>
        <a href="wholesale.html" class="nav-item"><i class="fas fa-boxes"></i> Wholesale</a>
        <a href="cart.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Cart</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-clipboard-list"></i> Orders</a>
        
        <div class="nav-divider"></div>
        
        <a href="auction.html" class="nav-item"><i class="fas fa-gavel"></i> Auction</a>
        <a href="tools.html" class="nav-item"><i class="fas fa-tools"></i> Tools</a>
        <a href="tickets.html" class="nav-item"><i class="fas fa-ticket-alt"></i> Tickets</a>
        <a href="help.html" class="nav-item"><i class="fas fa-question-circle"></i> Help</a>
        <a href="special.html" class="nav-item nav-special"><i class="fas fa-percentage"></i> Deals</a>
    </div>

    <div class="content">
        <div class="premium-header">
            <h1>Brian's club</h1>
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Online Users</h3>
                    <p id="online-users">2,451</p>
                </div>
                <div class="stat-card">
                    <h3>New Items</h3>
                    <p id="new-items">187</p>
                </div>
                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <p id="total-sales">$94,382</p>
                </div>
            </div>
        </div>
        
        <div class="marketplace-grid" id="marketplace-grid">
            <!-- Products will be dynamically inserted here -->
        </div>
        
        <div class="last-updated" id="last-updated">
            Last updated: <span id="update-time">Loading...</span>
        </div>
    </div>

    <script>
        // Product database with different categories
        const productDatabase = {
            dumps: [
                {
                    title: "Platinum Dumps",
                    price: 120,
                    type: "USA | Visa",
                    rating: 4.8,
                    description: "High balance dumps with PIN. 90% success rate. Fresh from last week.",
                    icon: "fa-credit-card",
                    badge: "HOT"
                },
                {
                    title: "Gold Dumps",
                    price: 95,
                    type: "EU | Mastercard",
                    rating: 4.5,
                    description: "Medium balance dumps with verified PIN. 85% success rate.",
                    icon: "fa-credit-card",
                    badge: "NEW"
                },
                {
                    title: "Corporate Dumps",
                    price: 150,
                    type: "USA | Amex",
                    rating: 4.9,
                    description: "Corporate account dumps with high limits. Perfect for large purchases.",
                    icon: "fa-building",
                    badge: "PREMIUM"
                }
            ],
            cvv: [
                {
                    title: "CVV Fullz",
                    price: 45,
                    type: "EU | Mastercard",
                    rating: 4.5,
                    description: "Complete fullz info with SSN, DOB, MMN. Verified and tested.",
                    icon: "fa-id-card",
                    badge: "NEW"
                },
                {
                    title: "Premium CVV",
                    price: 60,
                    type: "USA | Visa",
                    rating: 4.7,
                    description: "High balance credit cards with complete info. 95% valid rate.",
                    icon: "fa-id-card",
                    badge: "BEST"
                },
                {
                    title: "Business CVV",
                    price: 75,
                    type: "USA | Amex",
                    rating: 4.6,
                    description: "Business credit cards with high limits and corporate details.",
                    icon: "fa-briefcase",
                    badge: null
                }
            ],
            fullz: [
                {
                    title: "Business Fullz",
                    price: 85,
                    type: "USA | Amex",
                    rating: 4.7,
                    description: "Premium business accounts with EIN and full business details.",
                    icon: "fa-user-tie",
                    badge: null
                },
                {
                    title: "Premium Fullz",
                    price: 65,
                    type: "USA | Visa",
                    rating: 4.8,
                    description: "Complete personal information with credit history and bank details.",
                    icon: "fa-user-shield",
                    badge: "HOT"
                },
                {
                    title: "Bank Fullz",
                    price: 120,
                    type: "USA | Chase",
                    rating: 4.9,
                    description: "Full banking details with online access. Includes security questions.",
                    icon: "fa-university",
                    badge: "VIP"
                }
            ],
            wholesale: [
                {
                    title: "Wholesale Lot",
                    price: 500,
                    type: "Mixed | 50 Items",
                    rating: 4.9,
                    description: "Bulk package with mixed dumps and CVV. Perfect for resellers.",
                    icon: "fa-boxes",
                    badge: "SALE"
                },
                {
                    title: "Starter Pack",
                    price: 250,
                    type: "Mixed | 25 Items",
                    rating: 4.7,
                    description: "Great for beginners. Mix of dumps, CVV, and fullz to test.",
                    icon: "fa-box-open",
                    badge: "DEAL"
                },
                {
                    title: "Elite Package",
                    price: 1000,
                    type: "Premium | 100 Items",
                    rating: 5.0,
                    description: "Top-tier items only. Highest success rates guaranteed.",
                    icon: "fa-crown",
                    badge: "ELITE"
                }
            ]
        };

        // Function to generate random stats
        function generateRandomStats() {
            // Online users - random between 1500-3500
            const onlineUsers = Math.floor(Math.random() * 2000) + 1500;
            document.getElementById('online-users').textContent = onlineUsers.toLocaleString();
            
            // New items - random between 50-300
            const newItems = Math.floor(Math.random() * 250) + 50;
            document.getElementById('new-items').textContent = newItems;
            
            // Total sales - random between 50,000-150,000
            const totalSales = Math.floor(Math.random() * 100000) + 50000;
            document.getElementById('total-sales').textContent = '$' + totalSales.toLocaleString();
        }

        // Function to generate random products
        function generateRandomProducts() {
            const marketplaceGrid = document.getElementById('marketplace-grid');
            marketplaceGrid.innerHTML = '';
            
            // Get random category
            const categories = ['dumps', 'cvv', 'fullz', 'wholesale'];
            const selectedCategory = categories[Math.floor(Math.random() * categories.length)];
            
            // Get 4 random products from the selected category
            const products = [...productDatabase[selectedCategory]];
            while (products.length < 4) {
                // If not enough products in category, add from others
                const randomCat = categories[Math.floor(Math.random() * categories.length)];
                if (randomCat !== selectedCategory) {
                    const randomProduct = productDatabase[randomCat][Math.floor(Math.random() * productDatabase[randomCat].length)];
                    if (!products.some(p => p.title === randomProduct.title)) {
                        products.push(randomProduct);
                    }
                }
            }
            
            // Shuffle and take 4
            const shuffled = products.sort(() => 0.5 - Math.random());
            const selectedProducts = shuffled.slice(0, 4);
            
            // Generate product cards
            selectedProducts.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                let badgeHTML = '';
                if (product.badge) {
                    badgeHTML = `<div class="product-badge">${product.badge}</div>`;
                }
                
                productCard.innerHTML = `
                    ${badgeHTML}
                    <div class="product-image">
                        <i class="fas ${product.icon}"></i>
                    </div>
                    <div class="product-details">
                        <div class="product-title">
                            <span>${product.title}</span>
                            <span class="product-price">$${product.price}</span>
                        </div>
                        <div class="product-meta">
                            <span>${product.type}</span>
                            <span class="product-rating">
                                <i class="fas fa-star"></i> ${product.rating}
                            </span>
                        </div>
                        <div class="product-description">
                            ${product.description}
                        </div>
                        <div class="product-actions">
                            <button class="btn btn-primary">
                                <i class="fas fa-cart-plus"></i> Add to Cart
                            </button>
                            <button class="btn btn-outline">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                marketplaceGrid.appendChild(productCard);
            });
            
            // Update timestamp
            const now = new Date();
            document.getElementById('update-time').textContent = now.toLocaleString();
        }

        // Initial load
        generateRandomStats();
        generateRandomProducts();
        
        // Set up daily refresh (24 hours = 86400000 milliseconds)
        setInterval(() => {
            generateRandomStats();
            generateRandomProducts();
        }, 86400000);
        
        // Also update stats more frequently for realism (every 5 minutes)
        setInterval(generateRandomStats, 300000);
    </script>
</body>
</html>
