<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: #1e293b;
            --card-border: #334155;
            --special: #f97316;
            --special-hover: #ea580c;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: var(--darker);
            color: var(--light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .compact-nav {
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            white-space: nowrap;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            scrollbar-width: none;
            border-bottom: 1px solid var(--card-border);
        }
        
        .compact-nav::-webkit-scrollbar {
            display: none;
        }
        
        .nav-item {
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            border-bottom: 2px solid transparent;
        }
        
        .nav-item:hover {
            color: var(--light);
            background: rgba(139, 92, 246, 0.1);
        }
        
        .nav-item.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            font-weight: 600;
        }
        
        .content {
            margin-top: 72px;
            padding: 24px;
        }
        
        .cvv-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .cvv-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .cvv-item:hover {
            border-color: var(--primary);
        }
        
        .cvv-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .cvv-bank {
            font-weight: bold;
            color: var(--primary);
        }
        
        .cvv-price {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .cvv-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            margin-top: 0;
            font-family: 'Courier New', monospace;
            white-space: pre;
        }
        
        .cvv-details.expanded {
            max-height: 1000px;
            margin-top: 12px;
            padding: 12px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 6px;
            border-left: 3px solid var(--primary);
        }
        
        .section-title {
            color: var(--primary);
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
        
        .sensitive {
            color: var(--danger);
            font-weight: bold;
        }
        
        .copy-btn {
            background: rgba(139, 92, 246, 0.1);
            border: none;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .country-flag {
            width: 16px;
            height: 12px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        @media (max-width: 768px) {
            .cvv-preview {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>

            let result = '';
            let previousDigit = null;
            
            for (let i = 0; i < length; i++) {
                let digit;
                do {
                    digit = Math.floor(Math.random() * 10).toString();
                } while (digit === previousDigit);
                
                result += digit;
                previousDigit = digit;
            }
            
            return result;
        }

            return `${generateRandomNumber(3)}.${generateRandomNumber(3)}.${generateRandomNumber(3)}.${generateRandomNumber(3)}`;

                'ES': 'Spain',
                'JP': 'Japan',
                'NL': 'Netherlands',
                'SE': 'Sweden',
                'CH': 'Switzerland'
            };
            const countryName = countryNames[cvv.country] || cvv.country;
            
            cvvItem.innerHTML = `
                <div class="cvv-preview">
                    <div class="cvv-bank">
                        <img src="https://flagcdn.com/16x12/${cvv.country.toLowerCase()}.png" class="country-flag" alt="${countryName}">
                        ${bankName}
                    </div>
                    <div class="cvv-price">${cvv.price}</div>
                </div>
                <div class="cvv-details">
                    <div class="section-title">CARD DETAILS</div>
                    ${formatDetails(cvv.cardDetails)}
                    
                    <div class="section-title">ADDRESS INFO</div>
                    ${formatDetails(cvv.addressInfo)}
                </div>
            `;
            
            // Add click event to toggle details
            cvvItem.addEventListener('click', function(e) {
                const details = this.querySelector('.cvv-details');
                details.classList.toggle('expanded');
                
                // Close other expanded items
                document.querySelectorAll('.cvv-item .cvv-details.expanded').forEach(item => {
                    if (item !== details) {
                        item.classList.remove('expanded');
                    }
                });
            });
            
            cvvList.appendChild(cvvItem);
        });
        
        function formatDetails(text) {
            return text.split('\n').map(line => {
                // Highlight sensitive data
                if (line.includes('Card Number:') || line.includes('CVV:') || line.includes('Phone Number:') || line.includes('Email:')) {
                    const parts = line.split(':');
                    return `${parts[0]}: <span class="sensitive">${parts.slice(1).join(':')}</span>`;
                }
                return line;
            }).join('\n');
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
