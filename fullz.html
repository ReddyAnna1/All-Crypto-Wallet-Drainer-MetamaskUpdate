<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian's club | Fullz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: #1e293b;
            --card-border: #334155;
            --special: #f97316;
            --special-hover: #ea580c;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: var(--darker);
            color: var(--light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .compact-nav {
            display: flex;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 0 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            white-space: nowrap;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            scrollbar-width: none;
            border-bottom: 1px solid var(--card-border);
        }
        
        .compact-nav::-webkit-scrollbar {
            display: none;
        }
        
        .nav-item {
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            border-bottom: 2px solid transparent;
        }
        
        .nav-item:hover {
            color: var(--light);
            background: rgba(139, 92, 246, 0.1);
        }
        
        .nav-item.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            font-weight: 600;
        }
        
        .content {
            margin-top: 72px;
            padding: 24px;
        }
        
        .fullz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .fullz-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .fullz-item:hover {
            border-color: var(--primary);
        }
        
        .fullz-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .fullz-location {
            font-weight: bold;
            color: var(--primary);
        }
        
        .fullz-price {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .fullz-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            margin-top: 0;
            font-family: 'Courier New', monospace;
            white-space: pre;
        }
        
        .fullz-details.expanded {
            max-height: 1000px;
            margin-top: 12px;
            padding: 12px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 6px;
            border-left: 3px solid var(--primary);
        }
        
        .section-title {
            color: var(--primary);
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
        
        .sensitive {
            color: var(--danger);
            font-weight: bold;
        }
        
        .copy-btn {
            background: rgba(139, 92, 246, 0.1);
            border: none;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .status {
            font-size: 12px;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .status-available {
            background: rgba(16, 185, 129, 0.2);
            color: var(--secondary);
        }
        
        .status-sold {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .status-none {
            background: rgba(100, 116, 139, 0.2);
            color: var(--gray);
        }
        
        .posted-date {
            font-size: 12px;
            color: var(--gray);
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .fullz-preview {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>

        // Function to generate random non-sequential numbers

            let result = '';
            let previousDigit = null;
            
            for (let i = 0; i < length; i++) {
                let digit;
                do {
                    digit = Math.floor(Math.random() * 10).toString();
                } while (digit === previousDigit);
                
                result += digit;
                previousDigit = digit;
            }
            
            return result;
        }

        // Function to generate random past date within last week
        function generateRecentPostDate() {
            const now = new Date();
            const daysAgo = Math.floor(Math.random() * 7); // 0-6 days ago
            const hoursAgo = Math.floor(Math.random() * 24); // 0-23 hours ago
            const postDate = new Date(now);
            postDate.setDate(now.getDate() - daysAgo);
            postDate.setHours(now.getHours() - hoursAgo);
            
            return postDate;
        }

        // Function to format date as "Posted: 2 days ago at 14:30"
        function formatPostDate(date) {
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            
            let timeAgo = '';
            if (days > 0) {
                timeAgo = `${days} day${days > 1 ? 's' : ''} ago`;
            } else if (hours > 0) {
                timeAgo = `${hours} hour${hours > 1 ? 's' : ''} ago`;
            } else {
                timeAgo = 'just now';
            }
            
            const hoursStr = date.getHours().toString().padStart(2, '0');
            const minsStr = date.getMinutes().toString().padStart(2, '0');
            
            return `Posted: ${timeAgo} at ${hoursStr}:${minsStr}`;
        }

        // Function to generate random sold out time (within last week)

            const soldDate = new Date(postDate);

            soldDate.setHours(soldDate.getHours() + hoursLater);
            
            const now = new Date();
            const diff = now - soldDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            const minsStr = soldDate.getMinutes().toString().padStart(2, '0');
            
            return `Sold out: ${timeAgo} at ${hoursStr}:${minsStr}`;

            // Add click event to toggle details
            fullzItem.addEventListener('click', function(e) {
                // Don't toggle if clicking on copy button
                if (e.target.classList.contains('copy-btn')) {
                    return;
                }
                
                const details = this.querySelector('.fullz-details');
                details.classList.toggle('expanded');
                
                // Close other expanded items
                document.querySelectorAll('.fullz-item .fullz-details.expanded').forEach(item => {
                    if (item !== details) {
                        item.classList.remove('expanded');
                    }
                });
            });
            
            fullzList.appendChild(fullzItem);
        });
        
        function formatDetails(text) {
            return text.split('\n').map(line => {
                // Highlight sensitive data
                if (line.includes('SSN:') || line.includes('DL Number:') || 
                    line.includes('Card Number:') || line.includes('CVV:') || 
                    line.includes('Account Number:') || line.includes('Phone Number:') ||
                    line.includes('Passport Number:') || line.includes('National Insurance Number:')) {
                    const parts = line.split(':');
                    return `${parts[0]}: <span class="sensitive">${parts.slice(1).join(':')}</span> <button class="copy-btn" onclick="copyToClipboard('${parts.slice(1).join(':').trim()}')"><i class="fas fa-copy"></i></button>`;
                }
                return line;
            }).join('\n');
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Make copyToClipboard available globally
        window.copyToClipboard = copyToClipboard;

        // Simulate marketplace updates every minute
        setInterval(() => {
            const fullzItems = document.querySelectorAll('.fullz-item');
            fullzItems.forEach((item, index) => {
                const statusElement = item.querySelector('.status');
                const dateElement = item.querySelector('.posted-date');
                
                // Get the original post date from data attribute or recreate it
                const originalPostDate = new Date(generateRecentPostDate());
                
                // Only keep the first item (index 0) as available
                if (index === 0) {
                    statusElement.className = 'status status-available';
                    statusElement.textContent = 'Available';
                    dateElement.textContent = formatPostDate(originalPostDate);
                } else {
                    statusElement.className = 'status status-sold';
                    statusElement.textContent = 'Sold out';
                    dateElement.textContent = generateSoldOutTime(originalPostDate);
                }
            });
        }, 60000); // Update every minute
    </script>
</body>
</html>
